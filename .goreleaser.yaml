version: 2

project_name: scout

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/scout
    binary: scout
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

dockers:
  - image_templates:
      - "ghcr.io/klarlabs-studio/scout:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/klarlabs-studio/scout"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=io.modelcontextprotocol.server.name=io.github.klarlabs-studio/scout"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64

  - image_templates:
      - "ghcr.io/klarlabs-studio/scout:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/klarlabs-studio/scout"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=io.modelcontextprotocol.server.name=io.github.klarlabs-studio/scout"
    dockerfile: Dockerfile
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/klarlabs-studio/scout:{{ .Version }}"
    image_templates:
      - "ghcr.io/klarlabs-studio/scout:{{ .Version }}-amd64"
      - "ghcr.io/klarlabs-studio/scout:{{ .Version }}-arm64"

  - name_template: "ghcr.io/klarlabs-studio/scout:latest"
    image_templates:
      - "ghcr.io/klarlabs-studio/scout:{{ .Version }}-amd64"
      - "ghcr.io/klarlabs-studio/scout:{{ .Version }}-arm64"

# The formula goes to the tap owned by the org that owns this repo, which is
# also the scope the org secret behind HOMEBREW_TAP_GITHUB_TOKEN can write to;
# a personal tap sits outside it and answers 403. scout.rb currently exists in
# BOTH taps, so whichever a user tapped first wins and the two drift apart —
# this makes the org copy the one that gets updated.
# homebrew_casks replaces brews (deprecated in GoReleaser v2.16). Homebrew's
# own guidance is that a cask, not a formula, is the right vehicle for a
# pre-compiled binary -- the formula path generated something that only
# pretended to build from source.
homebrew_casks:
    # The cask is scout-mcp, not scout: homebrew/cask already ships a
    # `scout` (Scout-App, a Sass processor), so `brew install --cask scout`
    # silently resolves to that one instead of this. As a formula the
    # clash produced a disambiguation warning; as a cask it just returns
    # the wrong product. The installed binary stays `scout` -- the
    # collision is in Homebrew's namespace, not on anyone's PATH.
    #
    # cask_renames.json in the tap carries existing `scout` installs over.
  - name: scout-mcp
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/klarlabs-studio/scout"
    description: "MCP server for AI-powered browser automation"
    license: "MIT"
    binaries:
      - scout
    hooks:
      post:
        # The release archives are not notarized, so Gatekeeper quarantines the
        # binary on first run. A formula was never subject to this; a cask is,
        # so without this scout refuses to start.
        install: |
          if OS.mac?
            system_command "xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/scout"]
          end
